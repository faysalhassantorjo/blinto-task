services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doomsday_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api
    container_name: doomsday_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
